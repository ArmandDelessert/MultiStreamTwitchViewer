<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwitchMultiView</title>
<meta name="description" content="Suivez plusieurs streams Twitch simultanément">
<meta name="theme-color" content="#9147ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MultiView">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="brand">Twitch<span>MultiView</span></div>

    <form id="addForm" autocomplete="off">
      <input id="channelInput" type="text" placeholder="Ajouter une chaîne (ex: zerator, ponce)" />
      <button type="submit">Ajouter</button>
    </form>

    <button id="splitToggleBtn" class="modeBtn" title="Ajouter une séparation pour créer deux zones">⊞ Ajouter une séparation</button>
    <button id="swapZonesBtn" class="modeBtn hidden" title="Inverser les vidéos des deux côtés">⇄ Inverser les côtés</button>

    <div class="globalActions">
      <button id="pauseAllBtn" title="Mettre tous les streams en pause">⏸ Tout mettre en pause</button>
      <button id="muteAllBtn" title="Couper le son de tous les streams">🔇 Couper tout le son</button>
      <button id="resyncAllBtn" title="Rattraper le direct sur tous les streams (réduire le décalage)">⏩ Rattraper le direct</button>
      <select id="qualitySelect" title="Qualité vidéo pour tous les streams">
        <option value="auto">Qualité : Auto</option>
        <option value="1080p60">Qualité : 1080p60</option>
        <option value="720p60">Qualité : 720p60</option>
        <option value="480p30">Qualité : 480p30</option>
        <option value="360p30">Qualité : 360p30</option>
        <option value="160p30">Qualité : 160p30</option>
      </select>
    </div>

    <button id="fullscreenBtn" title="Plein écran (Échap pour quitter)">⛶ Plein écran</button>
  </header>

  <main id="stage">
    <div id="emptyState">
      <p>Aucune chaîne ajoutée.</p>
      <p>Utilisez le champ ci-dessus pour ajouter des streamers à suivre (ZEvent, multigaming, etc.)</p>
    </div>
    <div id="tilesLayer"></div>
    <div id="focusHandle" title="Glisser pour redimensionner"></div>
  </main>

  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="app.js"></script>
</body>
</html>
