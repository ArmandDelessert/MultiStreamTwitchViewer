<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwitchMultiView</title>
<meta name="description" content="Suivez plusieurs streams Twitch simultanément">
<meta name="theme-color" content="#9147ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MultiView">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="brand">Twitch<span>MultiView</span></div>

    <form id="addForm" autocomplete="off">
      <input id="channelInput" type="text" placeholder="Ajouter une chaîne (ex: zerator, ponce)" />
      <button type="submit">Ajouter</button>
    </form>

    <button id="addContainerBtn" class="modeBtn" title="Ajouter un nouveau conteneur de vidéos">➕ Ajouter un conteneur</button>

    <button id="fullscreenBtn" title="Plein écran (Échap pour quitter)">⛶ Plein écran</button>

    <div class="twitchAccount">
      <button id="twitchAccountBtn" class="modeBtn" title="Connecter votre compte Twitch">👤 Compte Twitch</button>
      <div id="twitchPanel" class="twitchPanel hidden"></div>
    </div>
  </header>

  <main id="stage">
    <div id="emptyState">
      <p>Aucune chaîne ajoutée.</p>
      <p>Utilisez le champ ci-dessus pour ajouter des streamers à suivre (ZEvent, multigaming, etc.)</p>
    </div>
    <div id="tilesLayer"></div>
    <div id="containersLayer"></div>
  </main>

  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="app.js"></script>
</body>
</html>
